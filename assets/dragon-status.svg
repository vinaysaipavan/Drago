<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 124" width="650" height="124">
  <defs>
    <!-- Metallic Gold Outer Border Gradient -->
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDF43" />
      <stop offset="35%" stop-color="#F5B700" />
      <stop offset="75%" stop-color="#D99B00" />
      <stop offset="100%" stop-color="#A67300" />
    </linearGradient>

    <!-- Sleek Card Interior Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10141D" />
      <stop offset="100%" stop-color="#080A0F" />
    </linearGradient>

    <!-- Dynamic Progress Bar Gradient -->
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D98A00" />
      <stop offset="60%" stop-color="#F5B700" />
      <stop offset="100%" stop-color="#FFD13B" />
    </linearGradient>

    <!-- Lightning Bolt Gradient -->
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF085" />
      <stop offset="100%" stop-color="#F5B700" />
    </linearGradient>

    <!-- Subtle Tech Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Chamfered Golden Border & Chassis -->
  <path d="M 12,2 L 638,2 L 648,12 L 648,112 L 638,122 L 12,122 L 2,112 L 2,12 Z"
        fill="url(#cardBg)"
        stroke="url(#goldBorder)"
        stroke-width="2" />

  <!-- Inner Recessed Chamfer Bevel -->
  <path d="M 14,4 L 636,4 L 646,14 L 646,110 L 636,120 L 14,120 L 4,110 L 4,14 Z"
        fill="none"
        stroke="#1E2530"
        stroke-width="1" />

  <!-- TOP ROW: Level Badge, Stage Name, XP & Progress -->
  <g id="topRow">
    <!-- Chamfered Level Badge -->
    <polygon points="24,18 76,18 83,28 76,38 24,38 17,28"
             fill="#0B0E14"
             stroke="#F5B700"
             stroke-width="1.5" />
    <text x="50" y="32"
          fill="#F5B700"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif"
          font-size="11"
          font-weight="900"
          font-style="italic"
          text-anchor="middle"
          letter-spacing="0.5">LVL 2</text>

    <!-- Bold Italic Stage Name -->
    <text x="96" y="32.5"
          fill="#FFFFFF"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif"
          font-size="16"
          font-weight="900"
          font-style="italic"
          letter-spacing="1">HATCHLING</text>

    <!-- Dynamic XP & Percentage -->
    <text x="628" y="32"
          text-anchor="end"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif">
      <tspan fill="#F5B700" font-size="14" font-weight="900" font-style="italic">25.0 XP</tspan>
      <tspan fill="#768390" font-size="12" font-weight="700" font-style="italic"> (38%)</tspan>
    </text>
  </g>

  <!-- PROGRESS BAR TRACK & ANGLED BAR -->
  <g id="progressBar">
    <!-- Recessed Dark Track -->
    <rect x="20" y="46" width="608" height="8" rx="2" fill="#12161F" stroke="#222834" stroke-width="1" />
    <!-- Angled Leading-Edge Progress Fill -->
    <polygon points="20,46 248,46 243,54 20,54"
             fill="url(#barGrad)"
             filter="url(#softGlow)" />
    <!-- Subtle Specular Top Highlight Line -->
    <line x1="20" y1="47" x2="248" y2="47" stroke="#FFF59D" stroke-width="1" stroke-opacity="0.8" />
  </g>

  <!-- BOTTOM STATS: 4 Separated Columns -->
  <!-- Vertical Divider Lines -->
  <line x1="172" y1="68" x2="172" y2="108" stroke="#222834" stroke-width="1" />
  <line x1="324" y1="68" x2="324" y2="108" stroke="#222834" stroke-width="1" />
  <line x1="476" y1="68" x2="476" y2="108" stroke="#222834" stroke-width="1" />

  <!-- Column 1: STREAK -->
  <g id="colStreak">
    <text x="24" y="76"
          fill="#768390"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="9.5"
          font-weight="700"
          letter-spacing="0.8">STREAK</text>
    <!-- Faceted 3D Gold Star Icon -->
    <g transform="translate(24, 86) scale(0.85)">
      <polygon points="9,1 11.5,6.5 17.5,7.3 13,11.5 14.2,17.4 9,14.5" fill="#FFC83B" />
      <polygon points="9,1 6.5,6.5 0.5,7.3 5,11.5 3.8,17.4 9,14.5" fill="#D48800" />
      <polygon points="9,1 11.5,6.5 9,14.5" fill="#FFEAA7" opacity="0.65" />
    </g>
    <text x="44" y="100"
          fill="#FFFFFF"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="15"
          font-weight="900"
          font-style="italic">0 days</text>
  </g>

  <!-- Column 2: EVOLUTION POWER -->
  <g id="colEvolutionPower">
    <text x="184" y="76"
          fill="#768390"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="9.5"
          font-weight="700"
          letter-spacing="0.8">EVOLUTION POWER</text>
    <!-- Energetic Lightning Bolt Icon -->
    <g transform="translate(184, 85) scale(0.85)">
      <polygon points="9,1 2,10 7.5,10 5,18 14,8 8.5,8" fill="url(#boltGrad)" />
    </g>
    <text x="202" y="100"
          fill="#F5B700"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="15"
          font-weight="900"
          font-style="italic">25.0</text>
  </g>

  <!-- Column 3: COMMITS -->
  <g id="colCommits">
    <text x="336" y="76"
          fill="#768390"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="9.5"
          font-weight="700"
          letter-spacing="0.8">COMMITS</text>
    <!-- Metallic Commit Slabs / Ingots -->
    <g transform="translate(336, 88)">
      <polygon points="2,0 16,0 14,5 0,5" fill="#D0D7DE" />
      <polygon points="2,0 16,0 15,1.5 1,1.5" fill="#FFFFFF" opacity="0.8" />
      <polygon points="2,7 16,7 14,12 0,12" fill="#8C959F" />
      <polygon points="2,7 16,7 15,8.5 1,8.5" fill="#F6F8FA" opacity="0.6" />
    </g>
    <text x="358" y="100"
          fill="#FFFFFF"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="15"
          font-weight="900"
          font-style="italic">25</text>
  </g>

  <!-- Column 4: PULL REQUESTS -->
  <g id="colPullRequests">
    <text x="488" y="76"
          fill="#768390"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="9.5"
          font-weight="700"
          letter-spacing="0.8">PULL REQUESTS</text>
    <!-- Code Brackets PR Glyph < / > -->
    <g transform="translate(488, 87)">
      <path d="M 4,2 L 1,7 L 4,12" fill="none" stroke="#D0D7DE" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <line x1="9" y1="2" x2="6" y2="12" stroke="#8C959F" stroke-width="1.8" stroke-linecap="round" />
      <path d="M 11,2 L 14,7 L 11,12" fill="none" stroke="#D0D7DE" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
    </g>
    <text x="510" y="100"
          fill="#FFFFFF"
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="15"
          font-weight="900"
          font-style="italic">1</text>
  </g>
</svg>